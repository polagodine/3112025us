<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Od 3. novembra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100%;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: #0a0a0a;
    color: #f5f5f5;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    position: relative;
    min-height: 100vh;
  }

  /* Subtle red glow in background */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 45%, rgba(180, 20, 30, 0.22), transparent 65%);
    pointer-events: none;
  }

  /* Heart frame */
  .heart-frame {
    position: relative;
    width: min(720px, 96vw);
    aspect-ratio: 100 / 92;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .heart-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    animation: heartbeat 2.4s ease-in-out infinite;
    filter: drop-shadow(0 0 30px rgba(239, 68, 68, 0.35));
  }

  .heart-svg path {
    fill: rgba(180, 20, 30, 0.06);
    stroke: #ef4444;
    stroke-width: 0.45;
    stroke-linejoin: round;
  }

  @keyframes heartbeat {
    0%, 60%, 100% { transform: scale(1); }
    15%           { transform: scale(1.025); }
    30%           { transform: scale(1); }
    45%           { transform: scale(1.015); }
  }

  /* Inner content stack */
  .stack {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 70%;
    margin-top: 4%;
  }

  .card {
    width: 100%;
    text-align: center;
    padding: 22px 28px;
    border: 1px solid rgba(220, 38, 38, 0.4);
    border-radius: 4px;
    background: rgba(15, 15, 15, 0.92);
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.6),
      0 20px 50px rgba(0, 0, 0, 0.7),
      inset 0 0 40px rgba(180, 20, 30, 0.1);
  }

  .card.small {
    width: 65%;
    padding: 16px 22px;
  }

  .label {
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #b91c1c;
    margin-bottom: 12px;
    font-weight: 500;
  }

  .headline {
    font-size: clamp(15px, 2.2vw, 20px);
    font-weight: 300;
    color: #e5e5e5;
    margin-bottom: 16px;
    letter-spacing: 0.02em;
  }

  .headline .date {
    color: #ef4444;
    font-weight: 500;
    border-bottom: 1px solid rgba(239, 68, 68, 0.4);
    padding-bottom: 2px;
  }

  .counter {
    display: flex;
    justify-content: center;
    gap: 28px;
  }

  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 80px;
  }

  .number {
    font-size: clamp(32px, 5.8vw, 58px);
    font-weight: 700;
    line-height: 1;
    color: #f5f5f5;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 24px rgba(239, 68, 68, 0.25);
  }

  .number.accent {
    color: #ef4444;
  }

  .unit-label {
    margin-top: 8px;
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #888;
  }

  .divider {
    width: 1px;
    background: linear-gradient(to bottom, transparent, rgba(220, 38, 38, 0.5), transparent);
    align-self: stretch;
  }

  .infinity {
    font-size: clamp(40px, 7vw, 100px);
    line-height: 1;
    color: #ef4444;
    font-weight: 300;
    text-shadow: 0 0 30px rgba(239, 68, 68, 0.6);
    animation: pulse 3s ease-in-out infinite;
  }

  .initials {
    margin-top: 10px;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 0;
    line-height: 1;
    color: #f5f5f5;
    text-shadow: 0 0 24px rgba(239, 68, 68, 0.45);
  }

  .initials .letter {
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(34px, 5.8vw, 56px);
    color: #f5f5f5;
  }

  .initials .amp {
    font-family: 'Times New Roman', Times, serif, cursive;
    font-weight: 400;
    font-size: clamp(40px, 7vw, 50px);
    color: #ef4444;
    margin: 0 0.05em;
    transform: translateY(0.1em);
    text-shadow: 0 0 18px rgba(239, 68, 68, 0.6);
  }

  /* Olympic score card */
  .score {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    line-height: 1;
  }

  .score .digit {
    font-size: clamp(32px, 5.5vw, 54px);
    font-weight: 700;
    color: #f5f5f5;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 24px rgba(239, 68, 68, 0.3);
  }

  .score .dash {
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 300;
    color: #ef4444;
    text-shadow: 0 0 18px rgba(239, 68, 68, 0.5);
  }

  @keyframes pulse {
    0%, 100% {
      text-shadow: 0 0 30px rgba(239, 68, 68, 0.4);
      transform: scale(1);
    }
    50% {
      text-shadow: 0 0 50px rgba(239, 68, 68, 0.8);
      transform: scale(1.04);
    }
  }

  /* ============= MOBILE ============= */
  @media (max-width: 600px) {
    body {
      padding: 0;
      align-items: flex-start;
    }

    /* Heart fills the phone screen — limited by whichever is smaller:
       full viewport width, or available height converted to width via aspect ratio */
    .heart-frame {
      width: min(100vw, calc(100vh * 100 / 92));
      max-width: none;
      margin: auto 0;
    }

    /* Slightly thicker stroke so it reads well at full-screen size */
    .heart-svg path {
      stroke-width: 0.55;
    }

    .stack {
      width: 76%;
      gap: 8px;
      margin-top: 6%;
    }

    .card { padding: 14px 14px; }
    .card.small { width: 80%; padding: 11px 14px; }
    .label { font-size: 9px; letter-spacing: 0.22em; margin-bottom: 8px; }
    .headline { margin-bottom: 10px; font-size: 13px; }
    .counter { gap: 12px; }
    .unit { min-width: 0; }
    .number { font-size: clamp(28px, 8vw, 44px); }
    .unit-label { font-size: 9px; letter-spacing: 0.2em; margin-top: 6px; }
    .infinity { font-size: clamp(48px, 13vw, 90px); }
    .initials { margin-top: 6px; }
    .initials .letter { font-size: clamp(32px, 9vw, 50px); }
    .initials .amp { font-size: clamp(38px, 11vw, 58px); }
    .score { gap: 14px; }
    .score .digit { font-size: clamp(28px, 8vw, 44px); }
    .score .dash { font-size: clamp(24px, 7vw, 38px); }
  }
</style>
</head>
<body>
  <div class="heart-frame">
    <svg class="heart-svg" viewBox="0 0 100 92" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <path d="M50,86
               C50,86 6,58 6,30
               C6,16 16,6 30,6
               C40,6 47,12 50,20
               C53,12 60,6 70,6
               C84,6 94,16 94,30
               C94,58 50,86 50,86 Z" />
    </svg>

    <div class="stack">
      <div class="card">
        <div class="label">VOLIM TE</div>
        <h1 class="headline">Od <span class="date">3. novembra</span> je prošlo:</h1>
        <div class="counter">
          <div class="unit">
            <div class="number accent" id="months">---</div>
            <div class="unit-label">meseci</div>
          </div>
          <div class="divider"></div>
          <div class="unit">
            <div class="number" id="days">---</div>
            <div class="unit-label">dana</div>
          </div>
        </div>
      </div>

      <div class="card small">
        <div class="label">Preostalo</div>
        <div class="infinity">∞</div>
        <div class="initials">
          <span class="letter">E</span>
          <span class="amp">&amp;</span>
          <span class="letter">I</span>
        </div>
      </div>

      <div class="card small">
        <div class="label">Olimpijske igre</div>
        <div class="score">
          <span class="digit">1</span>
          <span class="dash">−</span>
          <span class="digit">99</span>
        </div>
      </div>
    </div>
  </div>

<script>
  function getStartDate() {
    const now = new Date();
    let year = now.getFullYear();
    let candidate = new Date(year, 10, 3);
    if (candidate > now) {
      candidate = new Date(year - 1, 10, 3);
    }
    return candidate;
  }

  function pluralizeMonths(n) {
    const mod10 = n % 10;
    const mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) return 'mesec';
    if ((mod10 >= 2 && mod10 <= 4) && (mod100 < 12 || mod100 > 14)) return 'meseca';
    return 'meseci';
  }

  function pluralizeDays(n) {
    const mod10 = n % 10;
    const mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) return 'dan';
    return 'dana';
  }

  function update() {
    const start = getStartDate();
    const now = new Date();

    let months = (now.getFullYear() - start.getFullYear()) * 12
               + (now.getMonth() - start.getMonth());

    const anchor = new Date(start.getFullYear(), start.getMonth() + months, start.getDate());
    if (anchor > now) months -= 1;

    const finalAnchor = new Date(start.getFullYear(), start.getMonth() + months, start.getDate());
    const days = Math.floor((now - finalAnchor) / (1000 * 60 * 60 * 24));

    document.getElementById('months').textContent = months;
    document.getElementById('days').textContent = days;

    document.querySelectorAll('.unit-label')[0].textContent = pluralizeMonths(months);
    document.querySelectorAll('.unit-label')[1].textContent = pluralizeDays(days);
  }

  update();
  setInterval(update, 60 * 1000);
</script>
</body>
</html>
